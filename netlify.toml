[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Gaztelaniazko bertsioa kendu da
[[redirects]]
  from = "/es/*"
  to = "/:splat"
  status = 301
