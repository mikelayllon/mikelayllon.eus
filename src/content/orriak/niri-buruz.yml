eu:
  sarrera: Dramaturgoa eta idazlea naiz. Gauzak sortzen ditut Piszifaktoria Ideien
    Laborategian. Eta entzuten den antzerkiaren inguruan ikertzen dut EHUn.
  testua: >-
    1980an jaio nintzen Laudion (Araban). Itzulpengintza eta Interpretazio
    gradua ikasi nuen Valentziako Nazioarteko Unibertsitatean, Antzerki Ikasketa
    Aurreratuen Masterra egin nuen ondoren UNIRen eta tesia prestatzen ari naiz
    orain EHUko Gizarte Komunikazioko doktorego-programan, kaleko praktika
    artistiko erlazionalak eta soinua uztartzen dituzten obrak ardatz hartuta.


    2015ean, Piszifaktoria Ideien Laborategia sortu nuen, Igor Arzuaga musikari
    eta lagunarekin batera. Geroztik, zirkuitu profesionalean estreinatu diren
    diziplinarteko hamaikatxo lan eszeniko sortu eta zuzendu ditut, bai eta
    EITBrentzako zenbait ikus-entzunezko eta entzunezko lan ere. Horrez gain,
    hainbat liburu argitaratu ditut, genero desberdinetakoak, hala nola
    narrazioak, saiakera, nobela edo literatura dramatikoa.


    Une honetan, Euskal Idazleen Elkarteko eta Euskal Herriko Kaleko Arteen
    Artekale elkarteko zuzendaritza-batzordeetako kidea naiz.


    Gaur egun, itzulpen-, sormen- eta ikerketa-lanen artean ematen dut nire
    denbora gehiena.
en:
  sarrera: I'm a playwright and writer. I make things at Piszifaktoria Ideien
    Laborategia, and at the University of the Basque Country (EHU) I research
    theatre made to be heard.
  testua: >-
    I was born in 1980 in Laudio (Araba, Basque Country). I studied Translation
    and Interpreting at the Valencian International University, then completed a
    Master's in Advanced Theatre Studies at UNIR, and I am now writing my PhD
    thesis in the Social Communication doctoral programme at the University of
    the Basque Country (EHU), focusing on works that bring together relational
    artistic practices in the street and sound.


    In 2015 I founded Piszifaktoria Ideien Laborategia with my friend, the
    musician Igor Arzuaga. Since then I have created and directed a good number
    of interdisciplinary stage works that have premiered on the professional
    circuit, as well as several audiovisual and audio pieces for EITB. I have
    also published a number of books across different genres, including short
    stories, essays, a novel and plays.


    I currently sit on the boards of the Basque Writers' Association (Euskal
    Idazleen Elkartea) and Artekale, the Basque Country's street arts
    association.


    These days I spend most of my time between translation, creative work and
    research.
